<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <title>TC-01 Risk Dialog Alignment</title>
  <style>
    body{margin:0;padding:40px;background:linear-gradient(135deg,#f3f7ff,#eefaf5);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#10233a}
    .board{max-width:1120px;margin:0 auto;background:#fff;border-radius:18px;box-shadow:0 20px 50px rgba(16,35,58,.12);overflow:hidden}
    .head{padding:28px 32px;background:#10233a;color:#fff}
    .head h1{margin:0;font-size:30px}
    .meta{display:flex;gap:12px;margin-top:12px;font-size:14px;opacity:.9}
    .content{padding:30px 32px}
    .ok{display:inline-block;background:#def7e7;color:#11663a;border-radius:999px;padding:6px 12px;font-weight:700}
    table{width:100%;border-collapse:collapse;margin-top:20px}
    th,td{padding:12px;border-bottom:1px solid #dfe7f2;text-align:left;font-size:14px}
    th{background:#f7fbff}
  </style>
</head>
<body>
  <main class="board">
    <header class="head">
      <h1>TC-01 権限確認ダイアログの設計整合性</h1>
      <div class="meta"><span>TASK-SKILL-LIFECYCLE-06</span><span>Phase 11 画面検証</span><span>2026-03-16</span></div>
    </header>
    <section class="content">
      <span class="ok">PASS</span>
      <table>
        <thead><tr><th>Risk</th><th>dialogWidth</th><th>allowApproveOnce</th><th>allowPermanent</th><th>autoDenyDefault</th></tr></thead>
        <tbody>
          <tr><td>critical</td><td>640</td><td>false</td><td>false</td><td>true</td></tr>
          <tr><td>high</td><td>480</td><td>true</td><td>false</td><td>false</td></tr>
          <tr><td>medium</td><td>400</td><td>true</td><td>true</td><td>false</td></tr>
          <tr><td>low</td><td>400</td><td>true</td><td>true</td><td>false</td></tr>
        </tbody>
      </table>
    </section>
  </main>
</body>
</html>
