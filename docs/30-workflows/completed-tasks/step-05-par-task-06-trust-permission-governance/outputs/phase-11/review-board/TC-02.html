<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <title>TC-02 Risk Classification Coverage</title>
  <style>
    body{margin:0;padding:40px;background:linear-gradient(120deg,#fff7ef,#f5f9ff);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#3a200f}
    .board{max-width:1120px;margin:0 auto;background:#fff;border-radius:18px;box-shadow:0 20px 50px rgba(58,32,15,.12);overflow:hidden}
    .head{padding:28px 32px;background:#8a3d12;color:#fff}
    .head h1{margin:0;font-size:30px}
    .content{padding:30px 32px}
    .ok{display:inline-block;background:#ecfdf4;color:#0f6b3a;border-radius:999px;padding:6px 12px;font-weight:700}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:18px}
    .card{border:1px solid #ecd8c9;border-radius:12px;padding:16px;background:#fffaf5}
    .num{font-size:30px;font-weight:800}
    .label{font-size:13px;color:#6e4a35}
  </style>
</head>
<body>
  <main class="board">
    <header class="head"><h1>TC-02 リスクレベル分類の網羅性</h1></header>
    <section class="content">
      <span class="ok">PASS</span>
      <div class="grid">
        <article class="card"><div class="num">24 / 24</div><div class="label">BASH_COMMANDS 分類完了</div></article>
        <article class="card"><div class="num">25 / 25</div><div class="label">PROTECTED_PATHS 分類完了</div></article>
        <article class="card"><div class="num">11 / 11</div><div class="label">ALLOWED_TOOLS_WHITELIST 分類完了</div></article>
        <article class="card"><div class="num">0</div><div class="label">未分類パターン</div></article>
      </div>
    </section>
  </main>
</body>
</html>
