<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <title>TC-06 Approval History Completeness</title>
  <style>
    body{margin:0;padding:40px;background:linear-gradient(130deg,#f4fff8,#eff7ff);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#14324f}
    .board{max-width:1120px;margin:0 auto;background:#fff;border-radius:18px;box-shadow:0 20px 50px rgba(20,50,79,.12);overflow:hidden}
    .head{padding:28px 32px;background:#0f6d52;color:#fff}
    .content{padding:30px 32px}
    .chips{display:flex;flex-wrap:wrap;gap:10px}
    .chip{padding:8px 12px;border-radius:999px;background:#e6f7ff;color:#0c3a5e;font-size:13px;font-weight:700}
    .ok{margin-top:14px;display:inline-block;background:#dcfce7;color:#166534;padding:6px 12px;border-radius:999px;font-weight:700}
  </style>
</head>
<body>
  <main class="board">
    <header class="head"><h1>TC-06 承認履歴フィールド完全性</h1></header>
    <section class="content">
      <div class="chips">
        <span class="chip">id</span><span class="chip">toolName</span><span class="chip">skillId</span><span class="chip">skillVersion</span>
        <span class="chip">decision</span><span class="chip">timestamp</span><span class="chip">riskLevel</span><span class="chip">triggerContext</span>
      </div>
      <div class="ok">PASS: 必須8フィールド整合・FIFO 1000件方針整合</div>
    </section>
  </main>
</body>
</html>
