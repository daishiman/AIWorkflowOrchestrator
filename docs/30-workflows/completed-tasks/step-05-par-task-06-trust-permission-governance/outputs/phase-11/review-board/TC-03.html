<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <title>TC-03 Permission State Transition</title>
  <style>
    body{margin:0;padding:40px;background:linear-gradient(140deg,#f2fbff,#eef5ff);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#12233f}
    .board{max-width:1120px;margin:0 auto;background:#fff;border-radius:18px;box-shadow:0 20px 50px rgba(18,35,63,.12);overflow:hidden}
    .head{padding:28px 32px;background:#124f8a;color:#fff}
    .content{padding:30px 32px}
    table{width:100%;border-collapse:collapse}
    th,td{padding:10px;border:1px solid #d7e6f7;text-align:center;font-size:13px}
    th{background:#f4faff}
    .ok{background:#dcfce7;color:#166534;font-weight:700}
    .ng{background:#fee2e2;color:#991b1b;font-weight:700}
  </style>
</head>
<body>
  <main class="board">
    <header class="head"><h1>TC-03 権限状態遷移の完全性（16組み合わせ）</h1></header>
    <section class="content">
      <table>
        <thead><tr><th>Risk \ State</th><th>denied</th><th>approved_once</th><th>approved</th><th>revoked</th></tr></thead>
        <tbody>
          <tr><th>critical</th><td class="ok">定義</td><td class="ng">禁止</td><td class="ng">禁止</td><td class="ng">到達不可</td></tr>
          <tr><th>high</th><td class="ok">定義</td><td class="ok">定義</td><td class="ng">禁止</td><td class="ng">到達不可</td></tr>
          <tr><th>medium</th><td class="ok">定義</td><td class="ok">定義</td><td class="ok">定義</td><td class="ok">定義</td></tr>
          <tr><th>low</th><td class="ok">定義</td><td class="ok">定義</td><td class="ok">定義</td><td class="ok">定義</td></tr>
        </tbody>
      </table>
    </section>
  </main>
</body>
</html>
