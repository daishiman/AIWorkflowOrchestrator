<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <title>TC-07 Abort Fallback Safety</title>
  <style>
    body{margin:0;padding:40px;background:linear-gradient(120deg,#fff7f0,#f2f4ff);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#2c1f40}
    .board{max-width:1120px;margin:0 auto;background:#fff;border-radius:18px;box-shadow:0 20px 50px rgba(44,31,64,.12);overflow:hidden}
    .head{padding:28px 32px;background:#5b2e90;color:#fff}
    .content{padding:30px 32px}
    ol{line-height:1.9;margin:0}
    .badge{display:inline-block;margin-top:14px;background:#e9f7ef;color:#0f6a3a;padding:6px 12px;border-radius:999px;font-weight:700}
  </style>
</head>
<body>
  <main class="board">
    <header class="head"><h1>TC-07 abort / skip / retry の安全性</h1></header>
    <section class="content">
      <ol>
        <li>abort: cancelAll -> revokeSessionEntries -> executionLog -> IPC送信</li>
        <li>skip: <code>{ approved: false, skip: true }</code> を返却して後続継続</li>
        <li>retry: 最大3回、3回目失敗で abort 移行</li>
        <li>timeout: 300,000ms 到達で abort へ自動移行</li>
      </ol>
      <span class="badge">PASS: SkillExecutor / PermissionResolver 契約と矛盾なし</span>
    </section>
  </main>
</body>
</html>
