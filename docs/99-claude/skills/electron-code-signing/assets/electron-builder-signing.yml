# Electron Code Signing Configuration Template
# electron-builder.yml に追加する署名設定

# =============================================================================
# macOS 署名設定
# =============================================================================
mac:
  # Developer IDを使用（App Store外配布用）
  identity: "Developer ID Application: Your Company Name (TEAM_ID)"

  # Hardened Runtime を有効化（公証に必須）
  hardenedRuntime: true

  # ゲートキーパー評価（テスト用、本番はtrue）
  gatekeeperAssess: true

  # エンタイトルメント設定
  entitlements: "build/entitlements.mac.plist"
  entitlementsInherit: "build/entitlements.mac.plist"

  # 公証設定
  notarize:
    # App Store Connect API経由（推奨）
    teamId: "YOUR_TEAM_ID"

# =============================================================================
# Windows 署名設定
# =============================================================================
win:
  # 署名方式の選択
  sign: "./scripts/custom-sign.js" # カスタム署名スクリプトの場合

  # 署名ハッシュアルゴリズム（SHA256推奨）
  signDlls: true

  # 証明書設定（環境変数から）
  certificateFile: "${WIN_CSC_LINK}"
  certificatePassword: "${WIN_CSC_KEY_PASSWORD}"

  # タイムスタンプサーバー
  timeStampServer: "http://timestamp.digicert.com"

  # アルゴリズム（SHA256推奨）
  rfc3161TimeStampServer: "http://timestamp.digicert.com"

# =============================================================================
# Linux 署名設定（GPG）
# =============================================================================
linux:
  # GPG署名（AppImage用）
  executableName: "your-app-name"

# =============================================================================
# 環境変数リファレンス（CI/CD設定用）
# =============================================================================
# macOS:
#   - APPLE_ID: Apple ID email
#   - APPLE_APP_SPECIFIC_PASSWORD: App-specific password for notarization
#   - APPLE_TEAM_ID: Team ID
#   - CSC_LINK: base64 encoded .p12 certificate
#   - CSC_KEY_PASSWORD: Certificate password
#
# Windows:
#   - WIN_CSC_LINK: Path to .pfx certificate
#   - WIN_CSC_KEY_PASSWORD: Certificate password
#
# Linux:
#   - GPG_KEY_ID: GPG key identifier
#   - GPG_PASSPHRASE: GPG key passphrase
