# GitHub Actions セキュアデプロイテンプレート
# 18-skills.md準拠 - github-actions-security スキル
#
# このテンプレートは以下のセキュリティ対策を含みます:
# - 最小権限の原則
# - ログマスキング
# - フォークPR制限
# - 品質ゲート統合
# - Environment protection

name: Secure CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# デフォルト権限を最小化
permissions:
  contents: read

jobs:
  # ============================================
  # ビルドジョブ
  # ============================================
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: dist/
          retention-days: 1

  # ============================================
  # セキュリティスキャンジョブ
  # ============================================
  security-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

      - name: Run npm audit
        run: npm audit --audit-level=high
        continue-on-error: true

  # ============================================
  # テストジョブ
  # ============================================
  test:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  # ============================================
  # ステージングデプロイジョブ
  # ============================================
  deploy-staging:
    runs-on: ubuntu-latest
    needs: [build, security-scan, test]
    # フォークPRからは実行しない
    if: |
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    environment:
      name: staging
      url: https://staging.example.com
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build
          path: dist/

      - name: Mask secrets
        run: |
          echo "::add-mask::${{ secrets.STAGING_API_KEY }}"

      - name: Deploy to staging
        env:
          API_KEY: ${{ secrets.STAGING_API_KEY }}
        run: |
          echo "Deploying to staging..."
          # ./deploy.sh staging

  # ============================================
  # 本番デプロイジョブ
  # ============================================
  deploy-production:
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    # mainブランチへのpushのみ
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
      url: https://example.com
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build
          path: dist/

      - name: Mask secrets
        run: |
          echo "::add-mask::${{ secrets.PROD_API_KEY }}"
          echo "::add-mask::${{ secrets.PROD_DB_PASSWORD }}"

      - name: Deploy to production
        env:
          API_KEY: ${{ secrets.PROD_API_KEY }}
          DB_PASSWORD: ${{ secrets.PROD_DB_PASSWORD }}
        run: |
          echo "Deploying to production..."
          # ./deploy.sh production

      - name: Notify deployment
        if: success()
        run: |
          echo "::notice title=Deployment Complete::Production deployment successful"
