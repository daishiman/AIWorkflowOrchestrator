# {設定ファイルタイトル}
# 作成日: {日付}
# バージョン: {バージョン}

# 基本設定
app:
  name: "{アプリケーション名}"
  version: "{バージョン}"
  environment: development # development | staging | production

# サーバー設定
server:
  host: localhost
  port: 3000
  timeout: 30000 # ミリ秒

# データベース設定
database:
  driver: sqlite
  path: ./data/app.db
  # connection:
  #   host: localhost
  #   port: 5432
  #   name: mydb

# ログ設定
logging:
  level: info # debug | info | warn | error
  format: json # json | text
  output:
    - console
    # - file

# 機能フラグ
features:
  feature_a: true
  feature_b: false

# 環境変数参照（例）
# secrets:
#   api_key: ${API_KEY}
#   db_password: ${DB_PASSWORD}
