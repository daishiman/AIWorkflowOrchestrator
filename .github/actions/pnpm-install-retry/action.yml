name: "Install dependencies with retry"
description: "Run pnpm install with retries and node_modules cache"

outputs:
  cache-status:
    description: "Human-readable cache classification"
    value: ${{ steps.check-cache-hit-rate.outputs.cache-status }}
  cache-kind:
    description: "Cache classification token: exact, fallback, or miss"
    value: ${{ steps.check-cache-hit-rate.outputs.cache-kind }}
  cache-reason:
    description: "Reason used for the cache classification"
    value: ${{ steps.check-cache-hit-rate.outputs.cache-reason }}
  annotation-level:
    description: "Annotation level emitted by the monitoring step"
    value: ${{ steps.check-cache-hit-rate.outputs.annotation-level }}

runs:
  using: "composite"
  steps:
    # CI Optimization (TASK-CI-OPT-001):
    # node_modules をキャッシュして pnpm install の固定費を削減する。
    # キャッシュキーは pnpm-lock.yaml のハッシュで管理し、lockfile 変更時に自動無効化する。
    #
    # 【Electron バイナリ分離キャッシュ設計】
    # ELECTRON_SKIP_BINARY_DOWNLOAD=1 のジョブ（Lint/TypeCheck 等）は
    # Electron バイナリなしでインストールを行うため、専用キャッシュエントリに分離する。
    # - バイナリなし: key = ...-no-electron-<hash>  （Lint/TypeCheck 等）
    # - バイナリあり: key = ...-<hash>              （test-desktop/build 等）
    # これにより、バイナリなしキャッシュを test-desktop が誤って利用し
    # "Electron failed to install correctly" でクラッシュするのを防ぐ。
    - name: Cache node_modules
      id: cache-node-modules
      uses: actions/cache@v4
      with:
        path: |
          node_modules
          apps/backend/node_modules
          apps/desktop/node_modules
          apps/web/node_modules
          packages/shared/node_modules
          packages/ui/node_modules
        # v2 プレフィックス: 修正前の汚染キャッシュ（Electronバイナリなし）を無効化するために追加
        key: ${{ runner.os }}-node-modules-v2-${{ env.ELECTRON_SKIP_BINARY_DOWNLOAD == '1' && 'no-electron-' || '' }}${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-node-modules-v2-${{ env.ELECTRON_SKIP_BINARY_DOWNLOAD == '1' && 'no-electron-' || '' }}
          ${{ runner.os }}-node-modules-v2-

    # TASK-CI-FUTURE-003: キャッシュヒット率モニタリング
    # cache-hit と cache restore 後の node_modules 存在を用いて 3 状態を判定する。
    # if: always() により cache step 失敗時も記録を残し、continue-on-error: true で CI をブロックしない。
    - name: キャッシュヒット率確認
      id: check-cache-hit-rate
      if: always()
      continue-on-error: true
      shell: bash
      env:
        CACHE_HIT: ${{ steps.cache-node-modules.outputs.cache-hit }}
      run: |
        set -euo pipefail

        cache_status="❌ キャッシュミス (Miss)"
        cache_kind="miss"
        cache_reason="cache-hit=false / node_modules が復元されなかった"
        annotation_level="warning"
        cache_restored="false"

        for path in \
          node_modules \
          apps/backend/node_modules \
          apps/desktop/node_modules \
          apps/web/node_modules \
          packages/shared/node_modules \
          packages/ui/node_modules; do
          if [ -d "$path" ]; then
            cache_restored="true"
            break
          fi
        done

        if [ "${CACHE_HIT:-}" = "true" ]; then
          cache_status="✅ 完全ヒット (Exact Hit)"
          cache_kind="exact"
          cache_reason="cache-hit=true かつ node_modules が復元済み"
          annotation_level=""
        elif [ "$cache_restored" = "true" ]; then
          cache_status="⚠️ フォールバックヒット (Partial Hit)"
          cache_kind="fallback"
          cache_reason="cache-hit=false / node_modules がフォールバック復元済み"
          annotation_level="notice"
        fi

        {
          echo "cache-status=$cache_status"
          echo "cache-kind=$cache_kind"
          echo "cache-reason=$cache_reason"
          echo "annotation-level=$annotation_level"
        } >> "$GITHUB_OUTPUT"

        echo "## キャッシュヒット率レポート" >> "$GITHUB_STEP_SUMMARY"
        echo "" >> "$GITHUB_STEP_SUMMARY"
        echo "| 項目 | 内容 |" >> "$GITHUB_STEP_SUMMARY"
        echo "|------|------|" >> "$GITHUB_STEP_SUMMARY"
        echo "| ジョブ名 | ${GITHUB_JOB:-unknown} |" >> "$GITHUB_STEP_SUMMARY"
        echo "| 判定種別 | $cache_kind |" >> "$GITHUB_STEP_SUMMARY"
        echo "| 判定結果 | $cache_status |" >> "$GITHUB_STEP_SUMMARY"
        echo "| 判定根拠 | $cache_reason |" >> "$GITHUB_STEP_SUMMARY"
        echo "| アノテーション | $annotation_level |" >> "$GITHUB_STEP_SUMMARY"

        if [ "$annotation_level" = "warning" ]; then
          echo "::warning::[$GITHUB_JOB] node_modules キャッシュミス。CI実行時間が増加する可能性があります。"
        elif [ "$annotation_level" = "notice" ]; then
          echo "::notice::[$GITHUB_JOB] node_modules キャッシュはフォールバックキーで復元されました。完全ヒットより効率が低下しています。"
        fi

    # CI Optimization (TASK-CI-OPT-001):
    # キャッシュヒット時は pnpm install をスキップする（フォールバック: ミス時は通常 install）
    - name: Install dependencies with retry
      if: steps.cache-node-modules.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail

        max_attempts="${INSTALL_RETRY_MAX_ATTEMPTS:-3}"
        attempt=1

        while [ "$attempt" -le "$max_attempts" ]; do
          echo "::group::pnpm install attempt ${attempt}/${max_attempts}"
          if pnpm install --frozen-lockfile; then
            echo "::endgroup::"
            exit 0
          fi
          echo "::endgroup::"

          if [ "$attempt" -lt "$max_attempts" ]; then
            sleep_seconds=$((attempt * 10))
            echo "pnpm install failed. retry in ${sleep_seconds}s..."
            # On retry, switch Electron binary mirror to npmmirror to avoid GitHub Releases CDN 502
            export ELECTRON_MIRROR="https://npmmirror.com/mirrors/electron/"
            echo "Switched ELECTRON_MIRROR to ${ELECTRON_MIRROR}"
            sleep "$sleep_seconds"
          fi

          attempt=$((attempt + 1))
        done

        echo "pnpm install failed after ${max_attempts} attempts"
        exit 1

    # Electron バイナリ保証ステップ（ELECTRON_SKIP_BINARY_DOWNLOAD が設定されていない場合のみ実行）
    # 【背景】pnpm ストアキャッシュ（setup-node cache:"pnpm"）は ELECTRON_SKIP_BINARY_DOWNLOAD=1 の
    # Lint/TypeCheck ジョブが最初に作成するため、Electron バイナリが含まれない場合がある。
    # pnpm install はストアにパッケージを発見すると postinstall を再実行しないため、
    # バイナリが欠損したままになる。このステップで欠損を検出し、明示的にダウンロードする。
    - name: Ensure Electron binary is present
      if: env.ELECTRON_SKIP_BINARY_DOWNLOAD != '1'
      shell: bash
      run: |
        INSTALL_SCRIPT=$(find node_modules/.pnpm -maxdepth 4 -name "install.js" \
          -path "*/electron/install.js" 2>/dev/null | head -1)
        if [ -z "$INSTALL_SCRIPT" ]; then
          echo "Electron install script not found (may not be a workspace dependency). Skipping."
          exit 0
        fi
        BIN_DIR=$(dirname "$INSTALL_SCRIPT")
        # electron パッケージは path.json にバイナリ相対パスを保存する（path.txt ではない）
        # dist/ ディレクトリの有無でバイナリ存在を確認する
        DIST_DIR="$BIN_DIR/dist"
        if [ -d "$DIST_DIR" ] && [ -n "$(ls -A "$DIST_DIR" 2>/dev/null)" ]; then
          echo "Electron binary OK: $DIST_DIR"
        else
          echo "Electron binary missing in $DIST_DIR. Downloading..."
          node "$INSTALL_SCRIPT"
        fi
