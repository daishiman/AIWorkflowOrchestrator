name: boundary-chain
version: "1.0.0"
description: Boundary chain config with minimum steps

steps:
  - id: step-1
    skill: validate
    args: {}
    depends_on: []
    timeout: 30
  - id: step-2
    skill: report
    args: {}
    depends_on:
      - step-1
    timeout: 30

error_handling:
  on_step_error: abort
  max_retries: 1
