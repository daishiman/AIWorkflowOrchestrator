name: fixture-parallel
version: "1.0.0"
description: テスト用パラレル設定

tasks:
  - id: task-1
    skill: analyze-request
    args: {}
    priority: 1
    timeout: 30
    required: true
  - id: task-2
    skill: generate-code
    args: {}
    priority: 1
    timeout: 30
    required: false

execution:
  max_concurrency: 2
  fail_fast: false
  timeout: 120

result_aggregation:
  strategy: merge
  merge_strategy: shallow
  include_failed: false

metadata:
  created_by: fixture
  tags:
    - test
    - parallel
