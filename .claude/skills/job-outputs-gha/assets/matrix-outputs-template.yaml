# マトリックス戦略での出力集約テンプレート
# 複数のマトリックスジョブからの出力を集約するパターン

name: マトリックス出力集約パターン

on:
  workflow_dispatch:

jobs:
  # マトリックス設定を準備
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: マトリックス定義
        id: set-matrix
        run: |
          matrix='["service-a", "service-b", "service-c"]'
          echo "matrix=$matrix" >> $GITHUB_OUTPUT

  # マトリックスジョブ（並列実行）
  build:
    runs-on: ubuntu-latest
    needs: prepare
    strategy:
      matrix:
        service: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    outputs:
      # マトリックスジョブでは最後に実行されたジョブの出力のみ取得可能
      # 全ての出力が必要な場合はアーティファクトを使用
      result: ${{ steps.build.outputs.result }}
    steps:
      - name: ビルド実行
        id: build
        run: |
          echo "ビルド中: ${{ matrix.service }}"
          echo "result=${{ matrix.service }}-success" >> $GITHUB_OUTPUT

      # アーティファクトで個別結果を保存
      - name: 結果をファイルに保存
        run: |
          mkdir -p results
          echo "${{ matrix.service }}=success" > results/${{ matrix.service }}.txt

      - name: アーティファクトとしてアップロード
        uses: actions/upload-artifact@v4
        with:
          name: build-result-${{ matrix.service }}
          path: results/

  # 全マトリックスジョブの結果を集約
  aggregate:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: 全アーティファクトをダウンロード
        uses: actions/download-artifact@v4
        with:
          pattern: build-result-*
          merge-multiple: true
          path: all-results

      - name: 結果を集約
        run: |
          echo "=== 全ビルド結果 ==="
          cat all-results/*.txt

# 注意点:
# 1. マトリックスジョブのoutputsは最後のジョブのみ取得可能
# 2. 全結果が必要な場合はアーティファクトを使用
# 3. fromJSON/toJSON でJSON配列を操作
