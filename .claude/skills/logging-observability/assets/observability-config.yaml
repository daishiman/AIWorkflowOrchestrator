# Observability Configuration Template
# Prometheus + Grafana + Alertmanager

---
# Prometheus scrape config
prometheus:
  global:
    scrape_interval: 15s
    evaluation_interval: 15s

  scrape_configs:
    - job_name: "application"
      static_configs:
        - targets: ["localhost:3000"]
      metrics_path: "/metrics"

    - job_name: "node-exporter"
      static_configs:
        - targets: ["localhost:9100"]

---
# Alert rules
alerting_rules:
  groups:
    - name: application-alerts
      rules:
        - alert: HighErrorRate
          expr: |
            sum(rate(http_requests_errors_total[5m]))
            / sum(rate(http_requests_total[5m])) > 0.01
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "High error rate detected"
            description: 'Error rate is {{ $value | printf "%.2f" }}%'

        - alert: HighLatency
          expr: |
            histogram_quantile(0.95,
              sum(rate(http_request_duration_seconds_bucket[5m])) by (le)
            ) > 1
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "High latency detected"
            description: 'P95 latency is {{ $value | printf "%.2f" }}s'

        - alert: ServiceDown
          expr: up == 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "Service is down"
            description: "{{ $labels.job }} has been down for more than 1 minute"

---
# Grafana dashboard config (JSON model reference)
grafana:
  dashboard:
    title: "Application Observability"
    panels:
      - title: "Request Rate"
        type: graph
        targets:
          - expr: "sum(rate(http_requests_total[5m]))"

      - title: "Error Rate"
        type: singlestat
        targets:
          - expr: |
              sum(rate(http_requests_errors_total[5m]))
              / sum(rate(http_requests_total[5m])) * 100

      - title: "Latency Distribution"
        type: heatmap
        targets:
          - expr: "sum(rate(http_request_duration_seconds_bucket[5m])) by (le)"

      - title: "Active Connections"
        type: gauge
        targets:
          - expr: "http_connections_active"

---
# Log aggregation config (Loki example)
loki:
  server:
    http_listen_port: 3100

  ingester:
    lifecycler:
      ring:
        kvstore:
          store: inmemory
        replication_factor: 1

  schema_config:
    configs:
      - from: 2024-01-01
        store: boltdb-shipper
        object_store: filesystem
        schema: v11
        index:
          prefix: index_
          period: 24h

  storage_config:
    boltdb_shipper:
      active_index_directory: /loki/index
      cache_location: /loki/cache
      shared_store: filesystem
    filesystem:
      directory: /loki/chunks

  limits_config:
    retention_period: 168h # 7 days
